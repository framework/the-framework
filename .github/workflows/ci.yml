name: CI
on: [ push, pull_request ]

jobs:
  build:
    # Prevent workflow being run twice, https://github.com/orgs/community/discussions/57827#discussioncomment-6579237
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      # Run the two suites as separate steps rather than one `pnpm test`. Turbo interleaves both
      # tasks' output into a single stream, and the dashboard's vitest run is long enough that a
      # failure in the framework suite scrolls out of reach — the reason three failures here could
      # not be diagnosed from the log. Separate steps keep each suite's output attributable, and
      # cost nothing now that they no longer race for the same cores.
      - run: pnpm --filter @gemstack/framework-dashboard test
      - run: pnpm --filter @gemstack/the-framework test
